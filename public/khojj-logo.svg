<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" fill="none" stroke="currentColor">
  <!-- KHOJJ Clean Uppercase Architectural Brandmark -->
  <g stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 'K' -->
    <line x1="20" y1="12" x2="20" y2="52" />
    <path d="M 48 16 L 22 34 L 50 52" />

    <!-- 'H' -->
    <line x1="68" y1="12" x2="68" y2="52" />
    <line x1="96" y1="12" x2="96" y2="52" />
    <line x1="68" y1="32" x2="96" y2="32" />

    <!-- 'O' -->
    <rect x="114" y="14" width="30" height="38" rx="8" />

    <!-- First 'J' (Uppercase with clean terminal, no dot) -->
    <line x1="162" y1="12" x2="182" y2="12" />
    <path d="M 176 12 L 176 42 C 176 49 170 52 163 50 C 158 48 156 43 156 40" />

    <!-- Second 'J' (Uppercase with clean terminal, no dot) -->
    <line x1="200" y1="12" x2="220" y2="12" />
    <path d="M 214 12 L 214 42 C 214 49 208 52 201 50 C 196 48 194 43 194 40" />
  </g>

  <!-- Tagline: The Premium Closet -->
  <text
    x="120"
